# infra-cost-ops — Infra Cost Operations (cloud spend tuning + drift)
#
# infra × saas. cost anomaly+right-size (one agent) → commitments →
# drift detect → tune. SRE reviews risky tunes; safe tunes auto-apply.
# FinOps governance (tags + budgets) runs alongside the tune chain.

name: "infra-cost-ops"
version: "1.0.0"
architecture: "managed_mesh"
environment: "development"
debug: true
log_level: "INFO"

redis:
  host: "${REDIS_HOST:localhost}"
  port: ${REDIS_PORT:6379}
  db: 0
  password: "${REDIS_PASSWORD:}"
  auto_storage: true
  decode_responses: true
  default_ttl: 86400
  session_ttl: 604800

auto_discover:
  directory: "./agency"
  pattern: "*_agent.py"
  recursive: false

manager:
  enabled: true
  model: "gpt-4o-mini"
  domain: "generic"
  can_intervene: true
  prompt: |
    Cloud cost optimization mesh. Successful turn:
      - cost_anomaly_agent flags spike / drift / idle AND proposes
        the instance / pod / replica tuning in the same turn
      - commitments_agent reviews RI/SP utilisation AND forecasts
        reserved-capacity savings
      - iac_drift_agent reconciles intended vs actual state
      - finops_governance_agent surfaces untagged costs and
        budget / forecast / overage alerts from the enterprise
        cloud-billing API (Cost Explorer / Cloud Billing / Cost
        Management via MCP)
      - regulatory_monitor_agent vetoes tunes that violate data
        residency or encryption mandates
      - SRE reviews production / data-tier changes
      - cost_tuner applies safe changes
      - audit logs every applied change

    Escalate when:
      - tune touches production data tier (databases, storage)
      - applied change increases cost or risks SLA
      - drift on critical resources (auth, billing, security)

  routing:
    mode: "learning"
    memory_size: 200
    confidence_threshold: 0.7
    fallback: "all"
    decay_days: 30

  knowledge:
    serviceName: "mongo_main"
    enabled: true
    groupName: "cost_runbook"

  escalation:
    targets:
      - type: "human_agent"
        agent: "cto_human"
      - type: "webhook"
        url: "${PAGER_WEBHOOK:https://events.pagerduty.com/v2/enqueue}"
        method: "POST"
        headers:
          Content-Type: "application/json"
        payload_template:
          incident_id: "{{tune_id}}"
          severity: "{{severity}}"
          message: "{{message}}"
          session_id: "{{session_id}}"
      - type: "channel"
        provider: "slack"
        channel_id: "${SLACK_INFRA_CHANNEL:}"
        message_template: "[infra-cost] {{message}} — tune {{tune_id}}"
    auto_escalate:
      max_retries: 2
      max_errors_per_session: 3
      timeout_threshold: 2

  health_check_interval: 60
  agent_timeout_threshold: 300
  chain_completion_timeout: 600

mesh:
  call_timeout: 120

data_structures:
  CostEvent:
    type: "object"
    properties:
      tune_id: { type: "string" }
      cloud: { type: "string" }            # aws | gcp | azure
      resource_id: { type: "string" }
      resource_kind: { type: "string" }    # ec2 | rds | gke | etc.
      anomaly_type: { type: "string" }
      received_at_utc: { type: "string" }
    required: ["cloud"]

entry_points:
  - name: "cost_anomaly_webhook"
    target: "cost_anomaly_agent"
    description: "Cloud cost-explorer anomaly alert"

  - name: "scheduled_rightsize"
    target: "cost_anomaly_agent"
    description: "Daily right-sizing sweep (classify + tune in one call)"

  - name: "scheduled_reserved"
    target: "commitments_agent"
    description: "Weekly reserved-capacity refresh"

  - name: "iac_commit"
    target: "iac_drift_agent"
    description: "Terraform / Pulumi commit triggers drift check"

  - name: "manual_action"
    target: "cost_anomaly_agent"
    description: "Operator-initiated"

  - name: "weekly_commit_review"
    target: "commitments_agent"
    description: "Mon 07:00 cron — RI/SP utilisation + rebalance recommendations"

  - name: "tag_compliance_sweep"
    target: "finops_governance_agent"
    description: "Sweep the cloud tag inventory (via the billing/CMDB MCP connector) for missing required tags"

  - name: "tag_inventory_ingest"
    target: "finops_governance_agent"
    description: "Forward one or more cloud resources to the billing/CMDB MCP connector"

  - name: "budget_check"
    target: "finops_governance_agent"
    description: "Check MTD spend vs budget for a cost-center (via the cloud-billing MCP connector)"

  - name: "ri_expiry_alert"
    target: "commitments_agent"
    description: "Reserved Instance within 30d of expiry — renew / re-shape / let lapse?"

  - name: "savings_plan_review"
    target: "commitments_agent"
    description: "Savings Plan utilisation drifted < 80% — propose adjustment"


# ── Direct-call entry points (every non-human, non-terminal
#    agent is API-addressable; bypasses the upstream chain).
#    Use for ad-hoc invocation, debugging, programmatic ingest.
  - name: "direct_call_cost_tuner"
    target: "cost_tuner_agent"
    description: "On-demand direct call to cost_tuner (programmatic) — bypasses upstream chain"

  # ── Lyzr-inspired agents (added in 2.3.x) ──
  - name: "compliance_veto_check"
    target: "regulatory_monitor_agent"
    description: "Pre-tune check — does this region/encryption change violate data-residency or encryption mandates?"


agents:

  # ────────────────────────────────────────────────────────────
  # cost_anomaly_agent — SELF-RELIANT cost analyst. The LLM
  # classifies the anomaly AND drafts the right-sizing tune in ONE
  # call; the backing module (agency/cost_anomaly_agent.py) owns
  # three Python jobs:
  #   @pre_compose  pull the cost/usage telemetry + the resource's
  #                 tags / blast-radius from the source store
  #                 (Cost Explorer + CloudWatch + CMDB in prod).
  #   @chain (1)    THE SAFETY-GATE FLOOR — re-derive data_tier from
  #                 the resource kind, blast_radius from the CMDB,
  #                 and FORCE is_safe_tune=false on any data-tier /
  #                 new_resource / critical-resource / over-cap tune.
  #                 The LLM can't waive it; it also recomputes the
  #                 right-sizing savings math when the LLM omitted it.
  #   @chain (2)    stash the floored tune payload BEFORE the
  #                 sre_human gate so an approval can resume cost_tuner.
  # ────────────────────────────────────────────────────────────
  cost_anomaly_agent:
    name: "cost_anomaly_agent"
    agent_type: "llm"
    description: "Classifies anomaly type + scope AND proposes the right-sizing tune"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 1400
    communication_type: "chain"
    prompt: |
      Two-stage task — return ONE JSON object with all keys.

      Stage 1 — classify this cost anomaly:
        - anomaly_type: must be EXACTLY one of: spike | drift | idle |
          new_resource | wasted_idle. When the signals are ambiguous,
          use "drift".
        - daily_impact_cents: estimated daily $ impact in cents
          (integer; 0 when unknown)
        - scope: single_resource | service | account — when unsure,
          use "single_resource"
        - production_tier: true if resource is in production serving path
        - cited_signals: list of metrics / events that drove the classification
        - sre_briefing: 3 sentence narrative for the SRE — NEVER empty.
          Lead with anomaly type + daily $ impact. Note if
          production-tier (high stakes). Recommend safe-tune vs human
          review.

      Stage 2 — propose the right-sizing tune for that anomaly:
        - current_spec: object
        - proposed_spec: object
        - daily_savings_cents: number (integer cents)
        - data_tier: bool      (database, storage = data tier)
        - is_safe_tune: bool   (not data_tier AND no SLA risk)

      HARD SAFEGUARDS — never violate these:
        - If "data_tier" is true, "is_safe_tune" MUST be false.
          Databases and storage are never auto-tuned.
        - If "anomaly_type" is "new_resource", "is_safe_tune" MUST be
          false and there is nothing to tune yet — still return the
          Stage 2 keys with empty objects / 0 / false.
        - Echo "tune_id" from the input payload UNCHANGED. When the
          input has no tune_id, set it to "".

      NOTE — data_tier, is_safe_tune, blast_radius and touches_critical
      are RE-DERIVED deterministically by the safety-gate @chain floor in
      agency/cost_anomaly_agent.py from the resource kind + the CMDB blast
      radius; your values are a starting point the floor can only DOWNGRADE
      (it never upgrades an unsafe tune to auto-apply). Return your best
      estimate; the floor is the authority.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"anomaly_type": "", "daily_impact_cents": 0, "scope": "", "production_tier": false, "cited_signals": [], "sre_briefing": "", "current_spec": {}, "proposed_spec": {}, "daily_savings_cents": 0, "data_tier": false, "is_safe_tune": false, "blast_radius": 0, "touches_critical": false, "tune_id": ""}
    enforce_yields: true
    enforce_yields_retry: 2
    # knowledge: kept cost_patterns (anomaly classification corpus) —
    # the absorbed sizing_model group folds into it; migrate any
    # sizing rows into the cost_patterns group.
    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "cost_patterns"
    yields:
      anomaly_type: "string"
      daily_impact_cents: "number"
      scope: "string"
      production_tier: "boolean"
      cited_signals: "list"
      sre_briefing: "string"
      current_spec: "object"
      proposed_spec: "object"
      daily_savings_cents: "number"
      data_tier: "boolean"
      is_safe_tune: "boolean"
      # Re-derived by the safety-gate @chain floor (deterministic):
      blast_radius: "number"           # downstream resource fan-out count
      touches_critical: "boolean"      # auth/billing/security/kms/iam
      # Identity passthrough — the SRE inbox sees WHICH tune is on review
      tune_id: "string"
    inputs:
      payload: "object"
      upstream_yields: "object"
    can_call:
      - agent: "commitments_agent"
        condition: "calling_agent_response.anomaly_type == 'new_resource'"

      # The prompt's HARD SAFEGUARDS force is_safe_tune=false for
      # new_resource, so this edge only fires on tunable anomalies.
      - agent: "cost_tuner_agent"
        condition: "calling_agent_response.is_safe_tune == true and calling_agent_response.data_tier == false"

      - agent: "sre_human"
        condition: "calling_agent_response.anomaly_type != 'new_resource' and calling_agent_response.is_safe_tune == false or calling_agent_response.anomaly_type != 'new_resource' and calling_agent_response.data_tier == true"

  # ────────────────────────────────────────────────────────────
  # commitments_agent — ONE commitments-analyst ROLE (2.3.x
  # consolidation: absorbed the former reserved-capacity planner
  # and commitment-utilisation reviewer).
  # Responsibility 1 — weekly RI/SP utilisation review (the LLM
  #   judgment that defines this role).
  # Responsibility 2 — reserved-capacity / savings-plan forecast.
  # The backing module (agency/commitments_agent.py) makes this role
  # SELF-RELIANT and the savings math deterministic:
  #   @pre_compose  pull the RI + Savings-Plan inventory from the
  #                 source store (AWS RI/SP, GCP CUDs in prod).
  #   @chain        THE SAVINGS FLOOR — recompute total_wasted /
  #                 potential_savings from the inventory; FAIL-CLOSED
  #                 to zero when no demonstrable waste (→ audit, not SRE).
  #   @compose      sre_human gets the full forecast; the audit logger
  #                 gets the zero-savings terminus summary.
  # Cadence change: the utilisation review moved from Tuesday 10:00
  # ("0 10 * * 2") to Monday 07:00 — ONE weekly wake (the planner's
  # original "0 7 * * 1" slot) now carries BOTH responsibilities.
  # knowledge: kept cloud_commit_catalog (commitments corpus — the
  # most relevant group; the absorbed planner had no knowledge).
  # ────────────────────────────────────────────────────────────
  commitments_agent:
    name: "commitments_agent"
    agent_type: "llm"
    description: "Commitments analyst — weekly RI/SP utilisation review + reserved-capacity savings forecast"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 1500
    communication_type: "chain"
    wake_up: "0 7 * * 1"               # Monday 07:00 — both responsibilities

    prompt: |


      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"underused_commits": [], "overused_workloads": [], "rebalance_recommendations": [], "total_wasted_cents_per_day": 0, "total_potential_savings_monthly_cents": 0, "executive_summary": "", "recommended_commit": {}, "expected_savings_pct": 0, "term_months": 0}
      You are the cloud commitments analyst. One role, two
      responsibilities — return ONE JSON object with ALL keys.

      Responsibility 1 — RI/SP utilisation review: review
      reserved-instance + savings-plan utilisation across the cloud
      accounts for the last 7 days:
        - underused_commits: list of {commit_id, type, expected_use_pct,
          actual_use_pct, wasted_cents_per_day}
        - overused_workloads: list of {workload, hours_over_commit,
          cost_at_on_demand_cents_per_day}  (on-demand burn that could
          be commit-covered)
        - rebalance_recommendations: list of {action, expected_monthly_savings_cents,
          rationale, requires_finance_approval}
        - total_wasted_cents_per_day: integer
        - total_potential_savings_monthly_cents: integer
        - executive_summary: 3-sentence overview for FinOps

      Responsibility 2 — reserved-capacity plan: propose the commit
      that covers the steady-state baseline:
        - recommended_commit: object (family / region / amount)
        - expected_savings_pct: number (0..1)
        - term_months: number (12 or 36)

      DETERMINISTIC RULES — apply exactly:
        - All *_cents values are INTEGER cents — never floats, never
          dollar strings.
        - "expected_savings_pct" must be between 0 and 1.
        - "term_months" must be exactly 12 or 36; when unsure use 12.
        - "executive_summary" has no leading/trailing whitespace.
        - Upstream forecast inputs OVERRIDE your estimates: when the
          input carries recommended_commit / expected_savings_pct /
          term_months values (including the _test_commit,
          _test_savings_pct, _test_term_months test keys), echo those
          values UNCHANGED instead of estimating your own.
        - FAIL CLOSED: when the input is empty, malformed, or gives no
          basis for a recommendation, return empty lists / empty
          objects and ZERO for every savings total — a zero-savings
          turn routes to the audit log, never to the SRE.

      Be conservative — recommending a rebalance that loses headroom
      under a traffic spike costs more than the saving.

    enforce_yields: true
    enforce_yields_retry: 1

    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "cloud_commit_catalog"

    yields:
      underused_commits: "list"
      overused_workloads: "list"
      rebalance_recommendations: "list"
      total_wasted_cents_per_day: "number"
      total_potential_savings_monthly_cents: "number"
      executive_summary: "string"
      recommended_commit: "object"
      expected_savings_pct: "number"
      term_months: "number"

    inputs:
      trigger: "string"
      upstream_yields: "object"

    can_call:
      # Union of both pre-merge edge sets. The planner's unconditional
      # sre_human edge folds into the OR below — a capacity forecast
      # with expected_savings_pct > 0 routes to the SRE exactly as the
      # savings>0 utilisation review always did; a zero-savings turn
      # lands in the audit log instead of dead-ending.
      - agent: "sre_human"
        condition: "calling_agent_response.total_potential_savings_monthly_cents > 0 or calling_agent_response.expected_savings_pct > 0"

      - agent: "infra_audit_logger_agent"
        condition: "calling_agent_response.total_potential_savings_monthly_cents == 0 and calling_agent_response.expected_savings_pct == 0"

  # ────────────────────────────────────────────────────────────
  # iac_drift_agent — SELF-RELIANT drift reconciler. The LLM writes
  # the drift narrative; the backing module
  # (agency/iac_drift_agent.py) owns two Python jobs:
  #   @pre_compose  pull the last terraform/pulumi plan's drift set
  #                 from the source store (the IaC planner in prod).
  #   @chain        THE BLAST-RADIUS FLOOR — re-scan every drifted
  #                 resource + attribute against the critical-keyword
  #                 taxonomy (auth/billing/security/kms/iam/secrets/…)
  #                 and FORCE critical_drift=true on any hit. The LLM
  #                 can never clear a critical-resource drift to "clean".
  # ────────────────────────────────────────────────────────────
  iac_drift_agent:
    name: "iac_drift_agent"
    agent_type: "llm"
    description: "Compares intended (IaC) vs actual cloud state"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 900
    communication_type: "chain"
    prompt: |
      You reconcile intended (Terraform / Pulumi) state against actual
      cloud state. The input payload carries the drifted resources /
      attributes detected on the last plan or commit.

      Rules — apply exactly:
        - "drift_count": integer — the number of drifted resources /
          attributes in the input. 0 when none.
        - "critical_drift": true ONLY if any drifted item touches a
          critical resource — auth, billing, security, kms, or iam
          (match those keywords in resource names / attributes,
          case-insensitive). Otherwise false.
        - "drift_summary": echo the input's drift items as a list,
          UNCHANGED. Empty list when none.

      NOTE — drift_count and critical_drift are RE-DERIVED deterministically
      by the blast-radius @chain floor in agency/iac_drift_agent.py: it
      re-scans every drift item against the critical-keyword taxonomy and
      can only RAISE criticality, never clear it. Return your best estimate;
      the floor is the authority.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"drift_count": 0, "critical_drift": false, "drift_summary": [], "critical_resources": []}
    enforce_yields: true
    enforce_yields_retry: 1
    yields:
      drift_count: "number"
      critical_drift: "boolean"
      drift_summary: "list"
      # Re-derived by the blast-radius @chain floor (deterministic):
      critical_resources: "list"       # which critical keywords matched
    inputs:
      payload: "object"
    can_call:
      - agent: "sre_human"
        condition: "calling_agent_response.critical_drift == true"

      - agent: "infra_audit_logger_agent"
        condition: "calling_agent_response.critical_drift == false"

  cost_tuner_agent:
    name: "cost_tuner_agent"
    agent_type: "programmatic"
    description: "Applies approved tunes (dev: stub; prod: cloud APIs)"
    communication_type: "execute"
    yields:
      applied: "boolean"
      applied_at_utc: "string"
      rollback_token: "string"
    inputs:
      proposed_spec: "object"
    can_call:
      - agent: "infra_audit_logger_agent"

  sre_human:
    name: "sre_human"
    agent_type: "human"
    is_human_powered: true
    description: "SRE — reviews risky tunes + critical drift"
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 14400
    # operator_ids: ["you@yourcompany.com"]   # optional — unset routes this
    #   gate to the SHARED inbox. Only set real operator emails: a
    #   placeholder assigns tasks to a nonexistent operator and they
    #   never appear in anyone's inbox.
    fallback_on_timeout: true
    fallback_response:
      decision: "escalate_to_cto"
      message: "escalate_to_cto"
      note: "SRE didn't respond — CTO escalation"
    yields:
      decision: "string"               # approve | reject | escalate_to_cto
      notes: "string"
      tune_id: "string"                # identity passthrough → cto_human inputs
    inputs:
      tune_id: "string"
    can_call:
      - agent: "cost_tuner_agent"
        condition: "calling_agent_response.human_message == 'approve' or calling_agent_response.human_message == 'Approve' or calling_agent_response.human_message == 'Approved'"

      - agent: "cto_human"
        condition: "calling_agent_response.human_message == 'escalate_to_cto'"

      - agent: "infra_audit_logger_agent"
        condition: "calling_agent_response.human_message == 'reject'"

  cto_human:
    name: "cto_human"
    agent_type: "human"
    is_human_powered: true
    description: "CTO — major cost / data-tier authority"
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 28800
    # operator_ids: ["you@yourcompany.com"]   # optional — unset routes this
    #   gate to the SHARED inbox. Only set real operator emails: a
    #   placeholder assigns tasks to a nonexistent operator and they
    #   never appear in anyone's inbox.
    fallback_on_timeout: true
    fallback_response:
      decision: "halt_for_review"
      message: "halt_for_review"
      note: "CTO unavailable — held"
    yields:
      decision: "string"
      directive: "string"
    inputs:
      tune_id: "string"
    can_call:
      - agent: "cost_tuner_agent"
        condition: "calling_agent_response.human_message == 'approve' or calling_agent_response.human_message == 'Approve' or calling_agent_response.human_message == 'Approved'"

      - agent: "infra_audit_logger_agent"
        condition: "calling_agent_response.human_message != 'approve' and calling_agent_response.human_message != 'Approve' and calling_agent_response.human_message != 'Approved'"

  infra_audit_logger_agent:
    name: "infra_audit_logger_agent"
    agent_type: "external"
    description: "Hash-chained WORM — every applied tune + decision"
    framework: "custom"
    communication_type: "execute"
    connector_config:
      sink_type: "local_file"
      local_file_path: "./logs/infra_audit.jsonl"
    yields:
      audit_event_id: "string"
      written_at_utc: "string"
      hash_chain_prev: "string"
      hash_chain_current: "string"
    inputs:
      session_id: "string"
      payload: "object"
    can_call: []

  # ────────────────────────────────────────────────────────────
  # finops_governance_agent — ONE FinOps-governance-analyst ROLE,
  # connector-backed. The backing module
  # (agency/finops_governance_agent.py) is the intelligence SHAPER:
  # it maps the cloud-billing MCP result into the governance yields
  # and enforces the BUDGET-OVERAGE @chain floor (a forecast overage
  # at/above store.BUDGET_OVERAGE_FLOOR_PCT FORCES requires_analyst_
  # action). DEV: the connector is unwired, so the shaper falls back
  # to the seeded store budgets so budget_check still produces a real
  # report day-0.
  #
  # Your system-of-record for cloud spend and resource inventory is
  # YOUR cloud billing / cost API — not a template SQLite file:
  #   · AWS  — Cost Explorer (GetCostAndUsage) + Resource Groups
  #            Tagging API, exposed via an MCP server (e.g. the AWS
  #            Cost Explorer MCP server)
  #   · GCP  — Cloud Billing API / BigQuery billing export via MCP
  #   · Azure — Cost Management API via MCP
  # Point CLOUD_BILLING_MCP_URL at that MCP server and set tool_name
  # to the cost/usage tool it exposes. The agent forwards its inputs
  # (mode, cost_center, date range, resources …) as tool arguments
  # and yields the governance report below.
  #
  # Responsibility 1 — tag compliance: untagged costs by missing tag
  #   before the month-end chargeback (from your tag inventory / CMDB).
  # Responsibility 2 — budget alerts: MTD spend by cost-center,
  #   month-end forecast, burn trend, overage alerts (from your
  #   billing API).
  # ────────────────────────────────────────────────────────────
  finops_governance_agent:
    name: "finops_governance_agent"
    agent_type: "programmatic"
    description: "FinOps governance via your cloud billing/cost API (AWS Cost Explorer / GCP Cloud Billing / Azure Cost Management over MCP) — tag compliance + budget/forecast/overage alerts"
    communication_type: "chain"
    integration: "mcp"
    connector_config:
      transport: "http"
      url: "${CLOUD_BILLING_MCP_URL:}"          # your cloud-billing MCP server
      auth_token: "${CLOUD_BILLING_MCP_TOKEN:}"
      tool_name: "get_cost_and_usage"           # the cost/usage tool your MCP server exposes
      timeout: 60.0
    # wake_up: "0 8 * * *"             # daily 08:00 governance sweep —
    # enable after wiring your cloud-billing connector — a cron sweeping
    # an unwired connector just fills the logs with errors
    yields:
      mode: "string"
      total_resources: "number"
      fully_compliant: "number"
      coverage_pct: "number"
      missing_tag_breakdown: "object"
      untagged_cost_cents_per_month: "number"
      requires_sre_action: "boolean"
      compliance_briefing: "string"
      cost_center: "string"
      mtd_cents: "number"
      monthly_budget_cents: "number"
      forecast_month_end_cents: "number"
      forecast_overage_pct: "number"
      burn_trend_pct: "number"
      anomaly_days_count: "number"
      requires_analyst_action: "boolean"
      budget_briefing: "string"
    inputs:
      mode: "string"
      resources: "list"
      resource_id: "string"
      cloud: "string"
      kind: "string"
      tags: "object"
      monthly_cost_cents: "number"
      cost_center: "string"
      date: "string"
      cents: "number"
      monthly_budget_cents: "number"
    can_call: []

    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # regulatory_monitor_agent — SELF-RELIANT compliance officer with a
  # DETERMINISTIC VETO floor. The LLM writes the compliance narrative
  # + cross-session veto ledger; the backing module
  # (agency/regulatory_monitor_agent.py) owns:
  #   @pre_compose  pull the workload's data-classes + applicable
  #                 frameworks + current region from the governance
  #                 registry (the source store; the governance service
  #                 in prod).
  #   @chain        THE VETO FLOOR — re-run the residency + encryption
  #                 checks; a deterministic violation FORCES vetoed=true
  #                 regardless of what the LLM scored. The LLM can raise
  #                 a veto but never clear a violating change.
  # The residency/encryption taxonomy is in the prompt (for the
  # narrative) AND in the store (for the deterministic floor).
  # ────────────────────────────────────────────────────────────
  regulatory_monitor_agent:
    name: "regulatory_monitor_agent"
    agent_type: "llm"
    description: "Vetoes cost tunes that violate active compliance constraints (data residency, encryption minimums)"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 1200
    communication_type: "chain"
    memory:
      cross_session: true              # veto ledger — replaces the old SQLite tune_vetoes table
      cross_session_limit: 100

    prompt: |
      You are the compliance veto check on proposed cloud cost tunes.
      The input carries: tune_id, workload_id, workload_data_classes
      (pii | customer_data | financial | phi), applicable_frameworks,
      and proposed_change ({kind, from_value, to_value}).

      DATA-RESIDENCY RULES — for kind "region_change", a framework is
      VIOLATED when its applies_to overlaps workload_data_classes AND
      the destination region (to_value, ignore any cloud prefix) is
      NOT in its allowed regions:
        · EU_GDPR       applies_to pii, customer_data — allowed:
          eu-west-1, eu-central-1, eu-north-1, eu-south-1,
          europe-west, europe-central
        · INDIA_DPDP    applies_to pii — allowed: ap-south-1, asia-south1
        · CHINA_PIPL    applies_to pii, financial — allowed:
          cn-north-1, cn-northwest-1
        · RUSSIA_FZ242  applies_to pii — allowed: ru-central1
        · CANADA_PIPEDA applies_to pii — allowed: ca-central-1,
          northamerica-northeast
        · AUSTRALIA_PA  applies_to pii — allowed: ap-southeast-2,
          australia-southeast1

      ENCRYPTION MINIMUMS — for kind "encryption_change", the
      strictest applicable framework sets the floor: pci_dss / hipaa /
      fedramp_mod require at least AES-256-GCM; fedramp_hi requires
      AES-256-GCM-FIPS140. A to_value below the floor (anything not
      AES-256 class) is a violation — set "rule_violated" to
      "<required-spec>_required_for_data_classes".

      OUTPUT RULES — apply exactly:
        - Echo "tune_id", "workload_id", "proposed_change" UNCHANGED
          from the input; "data_classes" and "applicable_frameworks"
          echo the input lists sorted alphabetically.
        - "action" is "check" when a proposed_change is present,
          "skipped" when the input has none (then vetoed=false).
        - On violation: "vetoed" true, "rule_violated" names the
          framework, "veto_id" is "veto-<tune_id>-<unix-timestamp>",
          "requires_sre_review" true.
        - No violation: "vetoed" false, "rule_violated" "", "veto_id"
          "", "requires_sre_review" false.
        - VETO LEDGER: your memory holds previously recorded vetoes —
          compare this tune against them and stay consistent (the same
          tune_id + change must always produce the same verdict);
          state each new veto clearly so it lands in memory for later
          turns.
        - When in doubt, VETO — a false veto costs one SRE review; a
          false clear is a compliance breach.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"action": "", "tune_id": "", "workload_id": "", "vetoed": false, "rule_violated": "", "veto_id": "", "proposed_change": {}, "data_classes": [], "applicable_frameworks": [], "requires_sre_review": false}
    enforce_yields: true
    enforce_yields_retry: 1

    yields:
      action: "string"
      tune_id: "string"
      workload_id: "string"
      vetoed: "boolean"
      rule_violated: "string"
      veto_id: "string"
      proposed_change: "object"
      data_classes: "list"
      applicable_frameworks: "list"
      requires_sre_review: "boolean"

    inputs:
      upstream_yields: "object"
      tune_id: "string"
      workload_id: "string"
      workload_data_classes: "list"      # pii | customer_data | financial | phi
      applicable_frameworks: "list"      # EU_GDPR | INDIA_DPDP | etc.
      proposed_change: "object"          # {kind: region_change|encryption_change, from_value, to_value}

    can_call:
      # Vetoed tune → SRE review (override path). NOTE: on an
      # override-approve, cost_tuner recovers the tune payload from
      # the session stash (written upstream by cost_anomaly_agent) or
      # from the operator's human_data; a direct compliance_veto_check
      # entry with neither makes cost_tuner FAIL CLOSED (refuses to
      # apply an unrecoverable change) — by design.
      - agent: "sre_human"
        condition: "calling_agent_response.vetoed == true"

      # Clean tune → continue to existing cost_tuner (synchronous
      # path — proposed_change flows through upstream yields).
      - agent: "cost_tuner_agent"
        condition: "calling_agent_response.vetoed == false"

    auto_store_response: true
    auto_store_yields: true
