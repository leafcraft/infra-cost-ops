version: "3.9"
services:
  redis:
    image: redis:7-alpine
    container_name: infra-cost-ops-redis
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  infra-cost-ops:
    build: .
    container_name: infra-cost-ops
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports: ["18820:18820"]
    volumes: ["./logs:/app/logs"]
volumes:
  redis-data:
